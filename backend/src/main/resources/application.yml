spring:
  application:
    name: gasmtask
  config:
    # Permite rodar localmente reaproveitando o .env da raiz do repositório (o mesmo usado pelo Docker Compose)
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gasmtask}
    username: ${DB_USER:gasmtask}
    password: ${DB_PASSWORD:gasmtask}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # o schema é das migrations; o Hibernate só confere
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  # SERVER_PORT no .env (fora do Docker); PORT é o que serviços como Railway e Render informam
  port: ${SERVER_PORT:${PORT:8080}}
  forward-headers-strategy: native   # atrás do Nginx ou do proxy HTTPS do serviço de hospedagem
  compression:                       # o PWA servido pela própria API (Dockerfile da raiz) vai comprimido
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json,application/manifest+json,image/svg+xml

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET}         # obrigatório, mínimo de 32 bytes
      issuer: gasmtask
      access-token-ttl: 15m
    refresh-token:
      ttl: 30d
      reuse-grace-period: 10s     # tolera duas renovações quase simultâneas do mesmo token
      cookie-name: gt_refresh
      cookie-path: /api/v1/auth
      cookie-secure: ${AUTH_COOKIE_SECURE:true}
      cleanup-cron: "0 30 3 * * *"
  storage:
    dir: ${STORAGE_DIR:./data}       # fotos de prova; no Docker, um volume
  rewards:                          # RN17: valores fixos para o ranking não ser inflável
    mandatory-points: 5
    mandatory-coins: 3
    extra-min-points: 1
    extra-max-points: 2
    extra-coins: 1
    on-time-bonus: 1
    proof-bonus: 1
    on-time-tolerance: 30m          # RN15: de 30 min antes do horário até 30 min depois do fim previsto
  planning:
    max-mandatory-per-day: 10       # RN12
    max-extras-per-day: 5
  day-closing:
    enabled: true                   # fecha os dias de todos os usuários (pendentes viram perdidas)
    interval: PT10M
    initial-delay: PT1M
  progression:                      # elo ranqueado: além dos pontos de cada tarefa concluída
    day-fulfilled-bonus: 10         # XP extra no dia em que todas as obrigatórias são concluídas
    missed-mandatory-penalty: 5     # XP perdido por obrigatória que passou do dia sem ser concluída
  challenges:                       # desafios diários
    per-day: 3
    xp-reward: 10
    coin-reward: 3
  streak:                           # protetor de sequência: salva um dia de falha na virada do dia
    freeze-price: 40
    max-freezes: 2
  plans:                            # limites por plano, para virar SaaS (0 = sem limite)
    free:
      max-active-missions: 0
    pro:
      max-active-missions: 0
