# Serve o PWA e encaminha a API para o backend. Navegador e API ficam na mesma origem:
# sem CORS, e o cookie SameSite=Strict da sessão funciona sem configuração extra.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fotos de prova (Fase 2): até 5 MB, mais a margem do multipart.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # API e documentação vão para o Spring Boot. $http_host preserva a porta (ex.: localhost:3000),
    # e o X-Forwarded-Proto só é repassado quando já vem de fora (túnel HTTPS).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Service worker e manifest nunca ficam em cache: é assim que uma versão nova chega aos aparelhos.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # Arquivos com hash no nome mudam de nome a cada versão: cache longo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer outra rota abre o index.html, e o React Router decide a tela.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
